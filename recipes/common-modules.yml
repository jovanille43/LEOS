---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - python3-pyside6
        - python3-psutil
        - python3-evdev
        - vulkan-tools
        - libnotify
        - aurorae
        - qt6-qtmultimedia
        - qt6-qtsvg
        - google-noto-sans-fonts
        - plymouth
        - plymouth-plugin-two-step
        - plymouth-scripts
        - util-linux-core

  - type: copy
    src: gaming
    dest: /usr/share/leos/gaming/

  - type: copy
    src: launcher
    dest: /usr/share/leos/launcher/

  - type: copy
    src: control_center
    dest: /usr/share/leos/control_center/

  - type: copy
    src: controller_center
    dest: /usr/share/leos/controller_center/

  - type: copy
    src: shop
    dest: /usr/share/leos/shop/

  - type: copy
    src: desktop
    dest: /usr/share/leos/desktop/

  - type: copy
    src: plasma-theme/leos
    dest: /usr/share/plasma/desktoptheme/leos/

  - type: copy
    src: plasma-theme/look-and-feel/org.leos.desktop
    dest: /usr/share/plasma/look-and-feel/org.leos.desktop/

  - type: copy
    src: icons/leos
    dest: /usr/share/icons/leos/

  - type: copy
    src: aurorae/leos
    dest: /usr/share/aurorae/themes/leos/

  - type: copy
    src: files/config
    dest: /usr/share/leos/

  - type: copy
    src: packaging/leos-default-apps-setup
    dest: /usr/libexec/

  - type: copy
    src: packaging/leos-session-selector
    dest: /usr/libexec/

  - type: copy
    src: packaging/leos-default-gaming-apps-setup
    dest: /usr/libexec/

  - type: copy
    src: leos_core
    dest: /usr/share/leos/leos_core/

  # Only runtime branding assets enter the immutable image.
  # Original photos and visual references remain source material in the repository.
  - type: copy
    src: branding/desktop-logo.png
    dest: /usr/share/leos/branding/

  - type: copy
    src: branding/gaming-logo.png
    dest: /usr/share/leos/branding/

  - type: copy
    src: branding/desktop-wallpaper-logo.png
    dest: /usr/share/leos/branding/

  - type: copy
    src: branding/gaming-wallpaper-logo.png
    dest: /usr/share/leos/branding/

  - type: copy
    src: branding/animations/desktop-intro.mov
    dest: /usr/share/leos/branding/animations/

  - type: copy
    src: branding/animations/gaming-intro.mp4
    dest: /usr/share/leos/branding/animations/

  - type: copy
    src: branding/wallpapers/desktop-leos.svg
    dest: /usr/share/leos/branding/wallpapers/

  - type: copy
    src: branding/wallpapers/gaming-leos.svg
    dest: /usr/share/leos/branding/wallpapers/

  - type: copy
    src: branding/qml/ParticleBackdrop.qml
    dest: /usr/share/leos/branding/qml/

  - type: copy
    src: branding/qml/ModeIdentity.qml
    dest: /usr/share/leos/branding/qml/

  - type: copy
    src: branding/sddm/leos
    dest: /usr/share/sddm/themes/leos/

  - type: copy
    src: branding/plymouth/leos
    dest: /usr/share/plymouth/themes/leos/

  - type: copy
    src: files/sddm/90-leos-theme.conf
    dest: /usr/lib/sddm/sddm.conf.d/90-leos-theme.conf

  - type: script
    source: ghcr.io/blue-build/modules/script:v1
    scripts:
      - prepare-leos-plymouth.sh
      - prepare-leos-cursors.sh
    snippets:
      - plymouth-set-default-theme leos

  - type: copy
    src: desktop/applications/leos-mode-selector.desktop
    dest: /usr/share/applications/

  - type: copy
    src: desktop/applications/leos-control-center.desktop
    dest: /usr/share/applications/

  - type: copy
    src: desktop/applications/leos-controller-center.desktop
    dest: /usr/share/applications/

  - type: copy
    src: desktop/applications/leos-store.desktop
    dest: /usr/share/applications/

  - type: copy
    src: desktop/applications/leos-menu.desktop
    dest: /usr/share/applications/

  - type: copy
    src: desktop/applications/leos-notifications.desktop
    dest: /usr/share/applications/

  - type: copy
    src: desktop/autostart/leos-session.desktop
    dest: /usr/etc/xdg/autostart/

  - type: initramfs

  - type: signing
