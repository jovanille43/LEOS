<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>LEOS Gaming — scène immersive graphite</title>
  <desc>Une scène de jeu cinématique aux rubans métalliques en mouvement, aux particules suspendues et à l'emblème LEOS Gaming.</desc>
  <defs>
    <linearGradient id="deep-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset=".38" stop-color="#080808"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="stage-light" cx="50%" cy="50%" r="64%">
      <stop offset="0" stop-color="#B0B0B0" stop-opacity=".16"/>
      <stop offset=".34" stop-color="#5D5D5D" stop-opacity=".07"/>
      <stop offset="1" stop-color="#030303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DEDEDE" stop-opacity=".015"/>
      <stop offset=".34" stop-color="#B0B0B0" stop-opacity=".16"/>
      <stop offset=".52" stop-color="#A0A0A0" stop-opacity=".12"/>
      <stop offset=".72" stop-color="#8F8F8F" stop-opacity=".07"/>
      <stop offset="1" stop-color="#B8B8B8" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="accent-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A0A0A0" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#D8D8D8" stop-opacity=".045"/>
      <stop offset="1" stop-color="#B8B8B8" stop-opacity=".20"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset=".42" stop-color="#020202" stop-opacity="0"/>
      <stop offset="1" stop-color="#010101" stop-opacity=".94"/>
    </radialGradient>
    <pattern id="star-field" width="170" height="170" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="28" r="1.8" fill="#D8D8D8" fill-opacity=".30"/>
      <circle cx="112" cy="82" r="1.2" fill="#D8D8D8" fill-opacity=".18"/>
      <circle cx="64" cy="142" r="1" fill="#D8D8D8" fill-opacity=".15"/>
    </pattern>
    <filter id="ribbon-blur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#deep-stage)"/>
  <rect width="3840" height="2160" fill="url(#stage-light)"/>

  <g filter="url(#ribbon-blur)" opacity=".48" fill="none" stroke-width="88">
    <path d="M-220 1770C560 1520 820 620 1710 700S2860 1570 4070 300" stroke="#A0A0A0" stroke-opacity=".12"/>
    <path d="M-180 1620C600 1370 890 560 1740 640S2870 1430 4050 170" stroke="#A0A0A0" stroke-opacity=".13"/>
    <path d="M-120 1880C700 1610 1030 870 1840 890S2920 1520 4010 520" stroke="#B8B8B8" stroke-opacity=".10"/>
  </g>

  <g fill="none" stroke="url(#ribbon-metal)" stroke-width="5">
    <path d="M-220 1770C560 1520 820 620 1710 700S2860 1570 4070 300"/>
    <path d="M-180 1620C600 1370 890 560 1740 640S2870 1430 4050 170"/>
    <path d="M-120 1880C700 1610 1030 870 1840 890S2920 1520 4010 520"/>
  </g>
  <g fill="none" stroke="url(#accent-flow)" stroke-width="2">
    <path d="M-220 1810C560 1560 820 660 1710 740S2860 1610 4070 340"/>
    <path d="M-180 1660C600 1410 890 600 1740 680S2870 1470 4050 210"/>
    <path d="M-120 1920C700 1650 1030 910 1840 930S2920 1560 4010 560"/>
  </g>

  <g fill="none" stroke="#B8B8B8" stroke-opacity=".095">
    <ellipse cx="1920" cy="1080" rx="1190" ry="870" stroke-width="2" transform="rotate(-8 1920 1080)"/>
    <ellipse cx="1920" cy="1080" rx="1280" ry="940" stroke-width="1" stroke-dasharray="2 28" transform="rotate(7 1920 1080)"/>
    <ellipse cx="1920" cy="1080" rx="1380" ry="1010" stroke-width="1" stroke-dasharray="1 42"/>
  </g>

  <g fill="#D8D8D8">
    <circle cx="430" cy="520" r="3" opacity=".34"/>
    <circle cx="760" cy="360" r="2" opacity=".22"/>
    <circle cx="1120" cy="1840" r="3" opacity=".24"/>
    <circle cx="2920" cy="340" r="2.5" opacity=".28"/>
    <circle cx="3340" cy="1460" r="3" opacity=".32"/>
    <circle cx="3060" cy="1880" r="2" opacity=".2"/>
    <circle cx="1880" cy="260" r="2" opacity=".25"/>
    <circle cx="2240" cy="1940" r="2.5" opacity=".22"/>
  </g>
  <g fill="none" stroke="#D8D8D8" stroke-opacity=".16" filter="url(#soft-glow)">
    <path d="M430 520l330-160M2920 340l420 1120M1120 1840l1120 100"/>
  </g>

  <rect width="3840" height="2160" fill="url(#star-field)" opacity=".7"/>
  <rect width="3840" height="2160" fill="url(#vignette)"/>

  <image x="1060" y="180" width="1720" height="1800" preserveAspectRatio="xMidYMid meet"
         href="../gaming-wallpaper-logo.png" xlink:href="../gaming-wallpaper-logo.png"/>
</svg>