<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>LEOS Desktop — graphite cinématique</title>
  <desc>Un paysage graphite profond, des reliefs métalliques doux, une trame architecturale discrète et l'emblème LEOS.</desc>
  <defs>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset=".42" stop-color="#090909"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="silver-atmosphere" cx="50%" cy="43%" r="68%">
      <stop offset="0" stop-color="#B8B8B8" stop-opacity=".12"/>
      <stop offset=".34" stop-color="#606060" stop-opacity=".055"/>
      <stop offset="1" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge-falloff" cx="50%" cy="48%" r="74%">
      <stop offset=".48" stop-color="#020202" stop-opacity="0"/>
      <stop offset="1" stop-color="#020202" stop-opacity=".88"/>
    </radialGradient>
    <linearGradient id="accent-ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A0A0A0" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#AAAAAA" stop-opacity=".035"/>
      <stop offset="1" stop-color="#B8B8B8" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="metal-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D8D8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C5C5C5" stop-opacity=".15"/>
      <stop offset="1" stop-color="#D8D8D8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="micro-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#AAAAAA" stroke-opacity=".026" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.4" fill="#D5D5D5" fill-opacity=".08"/>
    </pattern>
    <pattern id="micro-dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C4C4C4" fill-opacity=".12"/>
    </pattern>
    <filter id="soft-metal-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="emblem-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#graphite)"/>
  <rect width="3840" height="2160" fill="url(#silver-atmosphere)"/>

  <g filter="url(#soft-metal-blur)" opacity=".55">
    <ellipse cx="1940" cy="1080" rx="1160" ry="610" fill="#777777" fill-opacity=".075"/>
    <ellipse cx="650" cy="1670" rx="820" ry="360" fill="#A0A0A0" fill-opacity=".055"/>
    <ellipse cx="3260" cy="430" rx="760" ry="350" fill="#B8B8B8" fill-opacity=".045"/>
  </g>

  <g fill="none" stroke="url(#metal-edge)" stroke-width="2">
    <path d="M-180 1740C500 1270 940 1170 1510 1370S2630 1770 4020 760"/>
    <path d="M-180 1800C500 1330 940 1230 1510 1430S2630 1830 4020 820" stroke-opacity=".5"/>
    <path d="M-160 350C650 690 1080 740 1640 560S2840 160 4020 520" stroke-opacity=".55"/>
  </g>
  <g fill="none" stroke="url(#accent-ribbon)" stroke-width="3">
    <path d="M-120 1660C520 1210 980 1140 1510 1320S2630 1710 3960 700"/>
    <path d="M-120 1720C520 1270 980 1200 1510 1380S2630 1770 3960 760" stroke-opacity=".45"/>
    <path d="M-120 420C650 760 1080 790 1640 610S2840 230 3960 590" stroke-opacity=".55"/>
  </g>

  <g fill="none" stroke="#AAAAAA" stroke-opacity=".075">
    <ellipse cx="1920" cy="1080" rx="1390" ry="960" stroke-width="2"/>
    <ellipse cx="1920" cy="1080" rx="1450" ry="1010" stroke-width="1" stroke-dasharray="2 30"/>
    <ellipse cx="1920" cy="1080" rx="1520" ry="1060" stroke-width="1" stroke-dasharray="1 42"/>
  </g>

  <rect width="3840" height="2160" fill="url(#micro-grid)"/>
  <rect width="3840" height="2160" fill="url(#micro-dots)" opacity=".28"/>
  <rect width="3840" height="2160" fill="url(#edge-falloff)"/>

  <ellipse cx="1920" cy="1110" rx="760" ry="790" fill="#020202" fill-opacity=".26" filter="url(#emblem-shadow)"/>
  <image x="1070" y="180" width="1700" height="1800" preserveAspectRatio="xMidYMid meet"
         href="../desktop-wallpaper-logo.png" xlink:href="../desktop-wallpaper-logo.png"/>
</svg>