<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>LEOS Desktop — graphite et argent</title>
  <desc>Fond de bureau graphite profond, reliefs métalliques discrets et emblème officiel du lion LEOS en grand sur la droite.</desc>

  <defs>
    <linearGradient id="graphite-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B1B1B"/>
      <stop offset=".42" stop-color="#111111"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>

    <radialGradient id="silver-halo" cx="70%" cy="47%" r="61%">
      <stop offset="0" stop-color="#D8D8D8" stop-opacity=".15"/>
      <stop offset=".38" stop-color="#989898" stop-opacity=".075"/>
      <stop offset="1" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="left-light" cx="16%" cy="22%" r="70%">
      <stop offset="0" stop-color="#B7B7B7" stop-opacity=".075"/>
      <stop offset=".55" stop-color="#6F6F6F" stop-opacity=".025"/>
      <stop offset="1" stop-color="#090909" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="52%" cy="48%" r="78%">
      <stop offset="0" stop-color="#070707" stop-opacity="0"/>
      <stop offset=".72" stop-color="#050505" stop-opacity=".20"/>
      <stop offset="1" stop-color="#030303" stop-opacity=".78"/>
    </radialGradient>

    <linearGradient id="etched-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCDCDC" stop-opacity=".23"/>
      <stop offset=".48" stop-color="#888888" stop-opacity=".045"/>
      <stop offset="1" stop-color="#CACACA" stop-opacity=".18"/>
    </linearGradient>

    <pattern id="micro-grid" width="112" height="112" patternUnits="userSpaceOnUse">
      <path d="M112 0H0V112" fill="none" stroke="#B3B3B3" stroke-opacity=".026" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.4" fill="#D6D6D6" fill-opacity=".055"/>
    </pattern>

    <pattern id="fine-brush" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 1H7" stroke="#BDBDBD" stroke-opacity=".025" stroke-width=".7"/>
    </pattern>

    <filter id="soft-metal-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>

    <filter id="soft-shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#graphite-base)"/>
  <rect width="3840" height="2160" fill="url(#left-light)"/>
  <rect width="3840" height="2160" fill="url(#silver-halo)"/>

  <!-- Quiet metallic light behind the official lion emblem. -->
  <g filter="url(#soft-metal-glow)" opacity=".34">
    <ellipse cx="2670" cy="1080" rx="650" ry="720" fill="#CBCBCB" fill-opacity=".16"/>
  </g>
  <g filter="url(#soft-shadow)" opacity=".56">
    <ellipse cx="2690" cy="1250" rx="590" ry="670" fill="#000000" fill-opacity=".34"/>
  </g>

  <!-- Restrained etched geometry; the left side remains deliberately open. -->
  <g fill="none" stroke="url(#etched-silver)" stroke-width="2">
    <path d="M-120 1590C470 1300 890 1260 1390 1380"/>
    <path d="M-120 1650C470 1360 890 1320 1390 1440" stroke-opacity=".42"/>
    <path d="M2490 -120C2920 340 3160 560 3370 940" stroke-opacity=".42"/>
    <path d="M2550 -120C2980 340 3220 560 3430 940" stroke-opacity=".24"/>
    <path d="M1650 2030C2070 1870 2440 1850 2860 1970" stroke-opacity=".24"/>
  </g>

  <g fill="none" stroke="#B7B7B7" stroke-width="2">
    <ellipse cx="2670" cy="1080" rx="930" ry="850"
             stroke-opacity=".075" stroke-dasharray="2 30"
             transform="rotate(-11 2670 1080)"/>
    <ellipse cx="2670" cy="1080" rx="1010" ry="930"
             stroke-opacity=".05" stroke-dasharray="2 38"
             transform="rotate(8 2670 1080)"/>
    <path d="M2670 80C2700 300 2700 420 2670 560" stroke-opacity=".075"/>
    <path d="M2670 1600C2640 1780 2640 1900 2670 2080" stroke-opacity=".075"/>
  </g>

  <rect width="3840" height="2160" fill="url(#micro-grid)"/>
  <rect width="3840" height="2160" fill="url(#fine-brush)" opacity=".42"/>
  <rect width="3840" height="2160" fill="url(#vignette)"/>

  <!-- The supplied LEOS lion remains the single source of truth. -->
  <image x="1740" y="115" width="1830" height="1930"
         preserveAspectRatio="xMidYMid meet"
         opacity=".96"
         href="../desktop-logo.jpeg"
         xlink:href="../desktop-logo.jpeg"/>
</svg>
