  <rect id="footer-topright" x="80" y="0" width="16" height="16" fill="#151515"/>
  <rect id="footer-left" x="0" y="16" width="16" height="16" fill="#151515"/>
  <rect id="footer-center" x="16" y="16" width="64" height="16" fill="#151515"/>
  <rect id="footer-right" x="80" y="16" width="16" height="16" fill="#151515"/>
  <path id="footer-bottomleft" d="M0 32H16V48H10Q0 48 0 38Z" fill="#151515"/>
  <rect id="footer-bottom" x="16" y="32" width="64" height="16" fill="#151515"/>
  <path id="footer-bottomright" d="M80 32H96V38Q96 48 86 48H80Z" fill="#151515"/>

  <rect id="hint-top-margin" x="0" y="0" width="1" height="6" fill="none"/>
