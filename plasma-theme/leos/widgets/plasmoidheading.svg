  <rect id="header-right" x="80" y="16" width="16" height="16" fill="#202020"/>
  <rect id="header-bottomleft" x="0" y="32" width="16" height="16" fill="#202020"/>
  <g id="header-bottom">
    <rect x="16" y="32" width="64" height="16" fill="#202020"/>
    <rect x="16" y="46" width="64" height="2" fill="url(#headingAccent)"/>
  </g>
  <rect id="header-bottomright" x="80" y="32" width="16" height="16" fill="#202020"/>

  <!-- Popup footer: straight upper seam, rounded lower corners. -->
  <rect id="footer-topleft" x="0" y="0" width="16" height="16" fill="#151515"/>
  <g id="footer-top">
    <rect x="16" y="0" width="64" height="16" fill="#151515"/>
