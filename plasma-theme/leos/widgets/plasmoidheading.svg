<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48">
  <defs>
    <linearGradient id="headingAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#777777" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E33BFF" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <!-- Popup header: rounded upper corners, straight lower seam. -->
  <path id="header-topleft" d="M10 0H16V16H0V10Q0 0 10 0Z" fill="#202020"/>
  <rect id="header-top" x="16" y="0" width="64" height="16" fill="#202020"/>
  <path id="header-topright" d="M80 0H86Q96 0 96 10V16H80Z" fill="#202020"/>
  <rect id="header-left" x="0" y="16" width="16" height="16" fill="#202020"/>
