<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="88" height="64" viewBox="0 0 88 64">
  <defs>
    <linearGradient id="activeMarker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.42"/>
      <stop offset="0.52" stop-color="#777777" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E33BFF" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="attentionMarker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.62"/>
      <stop offset="0.52" stop-color="#777777" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E33BFF" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <!-- Normal: quiet, almost invisible tile so the panel remains the main surface. -->
  <path id="normal-topleft" d="M8 0H14V14H0V8Q0 0 8 0Z" fill="#191919"/>
  <rect id="normal-top" x="14" y="0" width="60" height="14" fill="#191919"/>
  <path id="normal-topright" d="M74 0H80Q88 0 88 8V14H74Z" fill="#191919"/>
  <rect id="normal-left" x="0" y="14" width="14" height="36" fill="#191919"/>
  <rect id="normal-center" x="14" y="14" width="60" height="36" fill="#191919"/>
  <rect id="normal-right" x="74" y="14" width="14" height="36" fill="#191919"/>
  <path id="normal-bottomleft" d="M0 50H14V64H8Q0 64 0 56Z" fill="#191919"/>
  <rect id="normal-bottom" x="14" y="50" width="60" height="14" fill="#191919"/>
  <path id="normal-bottomright" d="M74 50H88V56Q88 64 80 64H74Z" fill="#191919"/>

  <!-- Hover: a restrained graphite lift, without a permanent neon outline. -->
  <path id="hover-topleft" d="M8 0H14V14H0V8Q0 0 8 0Z" fill="#242424"/>
  <rect id="hover-top" x="14" y="0" width="60" height="14" fill="#242424"/>
  <path id="hover-topright" d="M74 0H80Q88 0 88 8V14H74Z" fill="#242424"/>
  <rect id="hover-left" x="0" y="14" width="14" height="36" fill="#242424"/>
  <rect id="hover-center" x="14" y="14" width="60" height="36" fill="#242424"/>
  <rect id="hover-right" x="74" y="14" width="14" height="36" fill="#242424"/>
  <path id="hover-bottomleft" d="M0 50H14V64H8Q0 64 0 56Z" fill="#242424"/>
  <rect id="hover-bottom" x="14" y="50" width="60" height="14" fill="#242424"/>
  <path id="hover-bottomright" d="M74 50H88V56Q88 64 80 64H74Z" fill="#242424"/>

  <!-- Focus: slightly elevated tile with a thin, live A/B marker at the bottom. -->
  <path id="focus-topleft" d="M8 0H14V14H0V8Q0 0 8 0Z" fill="#282828"/>
  <rect id="focus-top" x="14" y="0" width="60" height="14" fill="#282828"/>
  <path id="focus-topright" d="M74 0H80Q88 0 88 8V14H74Z" fill="#282828"/>
  <rect id="focus-left" x="0" y="14" width="14" height="36" fill="#282828"/>
  <rect id="focus-center" x="14" y="14" width="60" height="36" fill="#282828"/>
  <rect id="focus-right" x="74" y="14" width="14" height="36" fill="#282828"/>
  <path id="focus-bottomleft" d="M0 50H14V64H8Q0 64 0 56Z" fill="#282828"/>
  <g id="focus-bottom">
    <rect x="14" y="50" width="60" height="14" fill="#282828"/>
    <rect x="14" y="62" width="60" height="2" fill="url(#activeMarker)"/>
  </g>
  <path id="focus-bottomright" d="M74 50H88V56Q88 64 80 64H74Z" fill="#282828"/>

  <!-- Attention: the same geometry, with a clearer but still narrow A/B signal. -->
  <path id="attention-topleft" d="M8 0H14V14H0V8Q0 0 8 0Z" fill="#262626"/>
  <rect id="attention-top" x="14" y="0" width="60" height="14" fill="#262626"/>
  <path id="attention-topright" d="M74 0H80Q88 0 88 8V14H74Z" fill="#262626"/>
  <rect id="attention-left" x="0" y="14" width="14" height="36" fill="#262626"/>
  <rect id="attention-center" x="14" y="14" width="60" height="36" fill="#262626"/>
  <rect id="attention-right" x="74" y="14" width="14" height="36" fill="#262626"/>
  <path id="attention-bottomleft" d="M0 50H14V64H8Q0 64 0 56Z" fill="#262626"/>
  <g id="attention-bottom">
    <rect x="14" y="50" width="60" height="14" fill="#262626"/>
    <rect x="14" y="62" width="60" height="2" fill="url(#attentionMarker)"/>
  </g>
  <path id="attention-bottomright" d="M74 50H88V56Q88 64 80 64H74Z" fill="#262626"/>

  <!-- Minimized: intentionally recedes behind active applications. -->
  <path id="minimized-topleft" d="M8 0H14V14H0V8Q0 0 8 0Z" fill="#111111" fill-opacity="0.76"/>
  <rect id="minimized-top" x="14" y="0" width="60" height="14" fill="#111111" fill-opacity="0.76"/>
  <path id="minimized-topright" d="M74 0H80Q88 0 88 8V14H74Z" fill="#111111" fill-opacity="0.76"/>
  <rect id="minimized-left" x="0" y="14" width="14" height="36" fill="#111111" fill-opacity="0.76"/>
  <rect id="minimized-center" x="14" y="14" width="60" height="36" fill="#111111" fill-opacity="0.76"/>
  <rect id="minimized-right" x="74" y="14" width="14" height="36" fill="#111111" fill-opacity="0.76"/>
  <path id="minimized-bottomleft" d="M0 50H14V64H8Q0 64 0 56Z" fill="#111111" fill-opacity="0.76"/>
  <rect id="minimized-bottom" x="14" y="50" width="60" height="14" fill="#111111" fill-opacity="0.76"/>
  <path id="minimized-bottomright" d="M74 50H88V56Q88 64 80 64H74Z" fill="#111111" fill-opacity="0.76"/>

  <rect id="normal-hint-top-margin" x="0" y="0" width="1" height="5" fill="none"/>
  <rect id="normal-hint-right-margin" x="0" y="0" width="5" height="1" fill="none"/>
  <rect id="normal-hint-bottom-margin" x="0" y="0" width="1" height="5" fill="none"/>
  <rect id="normal-hint-left-margin" x="0" y="0" width="5" height="1" fill="none"/>
  <rect id="hint-stretch-borders" x="0" y="0" width="1" height="1" fill="none"/>
</svg>
