name: Verify LEOS signing key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leos-signing-preflight
  cancel-in-progress: false

jobs:
  verify-signing-key:
    name: Verify Cosign key pair without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check signing materials
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_SECRET}" ]]; then
            echo "::error::The SIGNING_SECRET repository secret is not configured."
            exit 1
          fi
          if [[ ! -s cosign.pub ]]; then
            echo "::error::The matching cosign.pub file is missing from the repository root."
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify private and public signing keys match
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          chmod 700 "$workdir"
          printf '%s' "$SIGNING_SECRET" > "$workdir/cosign.key"
          chmod 600 "$workdir/cosign.key"
          tools/verify-cosign-key-pair.sh "$workdir/cosign.key" cosign.pub
