name: Deploy LEOS website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check website structure
        run: python -m unittest discover -s website/tests -v

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployable site
        run: |
          mkdir -p "$RUNNER_TEMP/leos-site/assets"
          cp website/index.html website/styles.css website/script.js website/404.html "$RUNNER_TEMP/leos-site/"
          cp website/assets/* "$RUNNER_TEMP/leos-site/assets/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/leos-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4