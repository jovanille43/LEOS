name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leos-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q gaming launcher control_center controller_center shop leos_core desktop tests

      - name: Run shared-core and controller-profile tests
        run: python -m unittest discover -s tests -v

      - name: Lint Qt Quick and QML sources
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            fedora:45 \
            bash -euc '
              dnf install -y qt6-qtdeclarative-devel qt6-qtmultimedia qt6-qtsvg
              mapfile -d "" qml_files < <(find launcher gaming control_center controller_center desktop shop -type f -name "*.qml" -print0)
              if [[ "${#qml_files[@]}" -eq 0 ]]; then
                echo "No QML sources found."
                exit 1
              fi
              for file in "${qml_files[@]}"; do
                echo "Linting ${file}"
                qmllint-qt6 "${file}"
              done
            '
