name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leos-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Cosign for offline signing helper test
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Exercise offline Cosign key-pair verifier
        env:
          COSIGN_PASSWORD: leos-ci-temporary-test-key
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          chmod 700 "$workdir"
          cosign generate-key-pair --output-key-prefix "$workdir/test"
          bash tools/verify-cosign-key-pair.sh "$workdir/test.key" "$workdir/test.pub"

      - name: Compile Python sources
        run: python -m compileall -q gaming launcher control_center controller_center shop leos_core desktop tests

      - name: Run shared-core and controller-profile tests
        run: python -m unittest discover -s tests -v
