name: Build LEOS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  bluebuild:
    name: Build LEOS image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for pre-build tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run LEOS Python test suite
        run: |
          set -euo pipefail
          python -m compileall -q gaming launcher control_center controller_center shop leos_core desktop tests
          python -m unittest discover -s tests -v

      - name: Verify official LEOS branding assets
        run: |
          set -euo pipefail
          required_assets=(
            branding/desktop-logo.jpeg
            branding/gaming-logo.jpeg
            branding/reference-comparison.jpeg
            branding/animations/desktop-intro.mov
            branding/animations/gaming-intro.mp4
            branding/animations/gaming-roar-reference.mp4
            branding/wallpapers/desktop-leos.svg
            branding/wallpapers/gaming-leos.svg
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -s "${asset}" ]]; then
              echo "::error::Official LEOS asset is missing: ${asset}"
              exit 1
            fi
          done
          sha256sum --check branding/DEPLOYED_SHA256SUMS

      - name: Lint Qt Quick and QML sources
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            fedora:45 \
            bash -euc '
              dnf install -y qt6-qtdeclarative-devel qt6-qtmultimedia qt6-qtsvg
              mapfile -d "" qml_files < <(find launcher gaming control_center controller_center desktop shop -type f -name "*.qml" -print0)
              if [[ "${#qml_files[@]}" -eq 0 ]]; then
                echo "No QML sources found."
                exit 1
              fi
              for file in "${qml_files[@]}"; do
                echo "Linting ${file}"
                qmllint-qt6 "${file}"
              done
            '

      - name: Validate wallpaper SVG assets and official emblem links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = "{http://www.w3.org/2000/svg}"
          xlink_href = "{http://www.w3.org/1999/xlink}href"
          expected = {
              Path("branding/wallpapers/desktop-leos.svg"): "../desktop-logo.jpeg",
              Path("branding/wallpapers/gaming-leos.svg"): "../gaming-logo.jpeg",
          }
          for wallpaper, emblem in expected.items():
              root = ET.parse(wallpaper).getroot()
              if root.attrib.get("viewBox") != "0 0 3840 2160":
                  raise SystemExit(f"Invalid 4K viewBox: {wallpaper}")
              images = root.findall(f".//{namespace}image")
              if (
                  len(images) != 1
                  or images[0].attrib.get("href") != emblem
                  or images[0].attrib.get(xlink_href) != emblem
              ):
                  raise SystemExit(f"Unexpected official emblem reference: {wallpaper}")
              target = (wallpaper.parent / emblem).resolve()
              if not target.is_file():
                  raise SystemExit(f"Wallpaper emblem is missing: {target}")
              print(f"Validated {wallpaper} -> {target}")
          PY

      - name: Check signing prerequisites
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_SECRET}" ]]; then
            echo "::error::The SIGNING_SECRET repository secret is not configured."
            exit 1
          fi
          if [[ ! -s cosign.pub ]]; then
            echo "::error::The matching cosign.pub file is missing from the repository root."
            exit 1
          fi

      - name: Validate Cosign key pair
        uses: sigstore/cosign-installer@v3
      - name: Verify private and public signing keys match
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          chmod 700 "$workdir"
          printf '%s' "$SIGNING_SECRET" > "$workdir/cosign.key"
          chmod 600 "$workdir/cosign.key"
          printf 'LEOS signing-key preflight\n' > "$workdir/challenge.txt"
          cosign sign-blob --key "$workdir/cosign.key" --output-signature "$workdir/challenge.sig" "$workdir/challenge.txt"
          cosign verify-blob --key cosign.pub --signature "$workdir/challenge.sig" "$workdir/challenge.txt"

      - name: Build and publish LEOS (AMD / Intel)
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number || 0 }}

      - name: Build and publish LEOS (NVIDIA)
        uses: blue-build/github-action@v1
        with:
          recipe: recipe-nvidia.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number || 0 }}

      - name: Build and publish LEOS (NVIDIA modern)
        uses: blue-build/github-action@v1
        with:
          recipe: recipe-nvidia-open.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number || 0 }}
