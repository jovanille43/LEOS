name: BlueBuild recipe checks

on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "packaging/**"
      - "gaming/**"
      - "launcher/**"
      - "control_center/**"
      - "controller_center/**"
      - "shop/**"
      - "leos_core/**"
      - "branding/**"
      - "desktop/**"
      - "tests/**"
      - "plasma-theme/**"
      - "icons/**"
      - "aurorae/**"
      - ".github/workflows/recipe-checks.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leos-bluebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-recipe:
    name: Validate LEOS image recipe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install BlueBuild CLI
        run: |
          set -euo pipefail
          docker pull ghcr.io/blue-build/cli:v0.9-installer
          docker create --name bluebuild-cli ghcr.io/blue-build/cli:v0.9-installer
          docker cp bluebuild-cli:/out/bluebuild "$RUNNER_TEMP/bluebuild"
          docker rm bluebuild-cli
          chmod +x "$RUNNER_TEMP/bluebuild"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint Qt Quick and QML sources
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            fedora:45 \
            bash -euc '
              dnf install -y qt6-qtdeclarative-devel qt6-qtmultimedia qt6-qtsvg python3-pyside6
              mapfile -d "" qml_files < <(find launcher gaming control_center controller_center desktop shop -type f -name "*.qml" -print0)
              if [[ "${#qml_files[@]}" -eq 0 ]]; then
                echo "No QML sources found."
                exit 1
              fi
              for file in "${qml_files[@]}"; do
                echo "Linting ${file}"
                qmllint-qt6 "${file}"
              done
              PYTHONPATH=/workspace python3 - <<'PY'
              import tempfile
              from pathlib import Path
              from PySide6.QtGui import QColor, QImage
              from desktop.branding_assets import _image_transform, build_color_matrix

              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  source = root / "source.png"
                  output = root / "derived.png"
                  image = QImage(3, 1, QImage.Format.Format_ARGB32)
                  image.setPixelColor(0, 0, QColor(0, 217, 255))
                  image.setPixelColor(1, 0, QColor(227, 59, 255))
                  image.setPixelColor(2, 0, QColor(128, 128, 128))
                  if not image.save(str(source), "PNG"):
                      raise SystemExit("Could not create the image transform fixture")
                  matrix = build_color_matrix("#FF8800", "#0055CC")
                  if not _image_transform(source, output, matrix):
                      raise SystemExit("LEOS logo recoloring did not produce an image")
                  result = QImage(str(output))
                  expected = ((255, 136, 0), (0, 85, 204), (128, 128, 128))
                  for column, rgb in enumerate(expected):
                      actual = result.pixelColor(column, 0)
                      if (actual.red(), actual.green(), actual.blue()) != rgb:
                          raise SystemExit(f"Unexpected recolored pixel: {actual.name()}")
              print("Validated derived logo endpoints and neutral metallic grey.")
              PY
            '

      - name: Set up Python for source and unit tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run LEOS Python test suite
        run: |
          set -euo pipefail
          python -m compileall -q gaming launcher control_center controller_center shop leos_core desktop tests
          python -m unittest discover -s tests -v

      - name: Check LEOS first-run shell script
        run: bash -n packaging/leos-default-apps-setup

      - name: Validate branding video and audio streams
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          videos=(
            branding/animations/desktop-intro.mov
            branding/animations/gaming-intro.mp4
            branding/animations/gaming-roar-reference.mp4
          )
          for video in "${videos[@]}"; do
            test -s "${video}"
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "${video}" | grep -q .; then
              echo "::error::No decodable video stream found in ${video}"
              exit 1
            fi
            if ! ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "${video}" | grep -q .; then
              echo "::error::No audio stream found in ${video}"
              exit 1
            fi
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 "${video}"
            ffmpeg -v error -i "${video}" -f null -
          done

      - name: Test theme-aware intro video conversion
        run: |
          set -euo pipefail
          python - <<'PY'
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          from desktop.branding_assets import (
              _available_video_encoder,
              _transform_video,
              build_color_matrix,
          )

          ffmpeg = shutil.which("ffmpeg")
          if not ffmpeg or not _available_video_encoder(ffmpeg):
              raise SystemExit("No supported FFmpeg video encoder is available.")
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source = root / "fixture.mp4"
              output = root / "fixture-themed.mp4"
              subprocess.run(
                  [
                      ffmpeg, "-hide_banner", "-loglevel", "error", "-y",
                      "-f", "lavfi", "-i", "testsrc2=size=320x180:rate=10",
                      "-f", "lavfi", "-i", "sine=frequency=440:sample_rate=44100",
                      "-t", "1", "-c:v", "mpeg4", "-q:v", "5", "-c:a", "aac",
                      "-shortest", str(source),
                  ],
                  shell=False, check=True, capture_output=True, timeout=30,
              )
              if not _transform_video(
                  source, output, build_color_matrix("#FF8800", "#0055CC")
              ):
                  raise SystemExit("LEOS could not create a recolored intro video.")
              probe = subprocess.run(
                  [
                      shutil.which("ffprobe"), "-v", "error",
                      "-show_entries", "stream=codec_type",
                      "-of", "csv=p=0", str(output),
                  ],
                  shell=False, check=True, capture_output=True, text=True, timeout=20,
              )
              streams = set(probe.stdout.splitlines())
              if not {"video", "audio"}.issubset(streams):
                  raise SystemExit(f"Recolored intro lost a stream: {streams}")
              print("Validated recolored intro video with audio retained.")
          PY

      - name: Verify deployed branding SHA-256 fingerprints
        run: sha256sum --check branding/DEPLOYED_SHA256SUMS

      - name: Report deployed branding SHA-256 fingerprints
        run: |
          set -euo pipefail
          sha256sum \
            branding/desktop-logo.jpeg \
            branding/gaming-logo.jpeg \
            branding/reference-comparison.jpeg \
            branding/animations/desktop-intro.mov \
            branding/animations/gaming-intro.mp4 \
            branding/animations/gaming-roar-reference.mp4 \
            branding/wallpapers/desktop-leos.svg \
            branding/wallpapers/gaming-leos.svg

      - name: Validate wallpaper SVG assets and official emblem links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = "{http://www.w3.org/2000/svg}"
          xlink_href = "{http://www.w3.org/1999/xlink}href"
          expected = {
              Path("branding/wallpapers/desktop-leos.svg"): "../desktop-logo.jpeg",
              Path("branding/wallpapers/gaming-leos.svg"): "../gaming-logo.jpeg",
          }
          for wallpaper, emblem in expected.items():
              root = ET.parse(wallpaper).getroot()
              if root.attrib.get("viewBox") != "0 0 3840 2160":
                  raise SystemExit(f"Invalid 4K viewBox: {wallpaper}")
              images = root.findall(f".//{namespace}image")
              if (
                  len(images) != 1
                  or images[0].attrib.get("href") != emblem
                  or images[0].attrib.get(xlink_href) != emblem
              ):
                  raise SystemExit(f"Unexpected official emblem reference: {wallpaper}")
              target = (wallpaper.parent / emblem).resolve()
              if not target.is_file():
                  raise SystemExit(f"Wallpaper emblem is missing: {target}")
              print(f"Validated {wallpaper} -> {target}")
          PY
      - name: Validate LEOS image recipes
        run: |
          set -euo pipefail
          bluebuild validate recipes/recipe.yml
          bluebuild validate recipes/recipe-nvidia.yml
          bluebuild validate recipes/recipe-nvidia-open.yml

      - name: Generate Containerfiles
        run: |
          set -euo pipefail
          for recipe in recipe.yml recipe-nvidia.yml recipe-nvidia-open.yml; do
            output="$RUNNER_TEMP/${recipe%.yml}-Containerfile"
            attempt=1
            max_attempts=3
            until bluebuild generate "recipes/${recipe}" -o "$output"; do
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "::error::BlueBuild could not generate ${recipe} after ${max_attempts} attempts."
                exit 1
              fi
              echo "BlueBuild schema/network request failed for ${recipe}; retrying (${attempt}/${max_attempts})..."
              sleep "$((attempt * 3))"
              attempt=$((attempt + 1))
            done
            test -s "$output"
          done
