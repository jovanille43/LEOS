name: BlueBuild recipe checks

on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "packaging/**"
      - "gaming/**"
      - "launcher/**"
      - "control_center/**"
      - "controller_center/**"
      - "shop/**"
      - "leos_core/**"
      - "branding/**"
      - "desktop/**"
      - "plasma-theme/**"
      - "icons/**"
      - "aurorae/**"
      - ".github/workflows/recipe-checks.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leos-bluebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-recipe:
    name: Validate LEOS image recipe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install BlueBuild CLI
        run: |
          set -euo pipefail
          docker pull ghcr.io/blue-build/cli:v0.9-installer
          docker create --name bluebuild-cli ghcr.io/blue-build/cli:v0.9-installer
          docker cp bluebuild-cli:/out/bluebuild "$RUNNER_TEMP/bluebuild"
          docker rm bluebuild-cli
          chmod +x "$RUNNER_TEMP/bluebuild"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check LEOS first-run shell script
        run: bash -n packaging/leos-default-apps-setup

      - name: Validate branding video and audio streams
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          videos=(
            branding/animations/desktop-intro.mov
            branding/animations/gaming-intro.mp4
            branding/animations/gaming-roar-reference.mp4
          )
          for video in "${videos[@]}"; do
            test -s "${video}"
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "${video}" | grep -q .; then
              echo "::error::No decodable video stream found in ${video}"
              exit 1
            fi
            if ! ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "${video}" | grep -q .; then
              echo "::error::No audio stream found in ${video}"
              exit 1
            fi
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 "${video}"
            ffmpeg -v error -i "${video}" -f null -
          done

      - name: Report deployed branding SHA-256 fingerprints
        run: |
          set -euo pipefail
          sha256sum \
            branding/desktop-logo.jpeg \
            branding/gaming-logo.jpeg \
            branding/reference-comparison.jpeg \
            branding/animations/desktop-intro.mov \
            branding/animations/gaming-intro.mp4 \
            branding/animations/gaming-roar-reference.mp4 \
            branding/wallpapers/desktop-leos.svg \
            branding/wallpapers/gaming-leos.svg

      - name: Validate wallpaper SVG assets and official emblem links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = "{http://www.w3.org/2000/svg}"
          xlink_href = "{http://www.w3.org/1999/xlink}href"
          expected = {
              Path("branding/wallpapers/desktop-leos.svg"): "../desktop-logo.jpeg",
              Path("branding/wallpapers/gaming-leos.svg"): "../gaming-logo.jpeg",
          }
          for wallpaper, emblem in expected.items():
              root = ET.parse(wallpaper).getroot()
              if root.attrib.get("viewBox") != "0 0 3840 2160":
                  raise SystemExit(f"Invalid 4K viewBox: {wallpaper}")
              images = root.findall(f".//{namespace}image")
              if (
                  len(images) != 1
                  or images[0].attrib.get("href") != emblem
                  or images[0].attrib.get(xlink_href) != emblem
              ):
                  raise SystemExit(f"Unexpected official emblem reference: {wallpaper}")
              target = (wallpaper.parent / emblem).resolve()
              if not target.is_file():
                  raise SystemExit(f"Wallpaper emblem is missing: {target}")
              print(f"Validated {wallpaper} -> {target}")
          PY
      - name: Validate BlueBuild recipe
        run: bluebuild validate recipes/recipe.yml

      - name: Generate Containerfile
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          until bluebuild generate recipes/recipe.yml -o "$RUNNER_TEMP/LEOS-Containerfile"; do
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "::error::BlueBuild could not generate the Containerfile after ${max_attempts} attempts."
              exit 1
            fi
            echo "BlueBuild schema/network request failed; retrying (${attempt}/${max_attempts})..."
            sleep "$((attempt * 3))"
            attempt=$((attempt + 1))
          done

      - name: Confirm generated build file
        run: test -s "$RUNNER_TEMP/LEOS-Containerfile"
