name: Generate LEOS installer ISO

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Hardware image variant to turn into an installer
        required: true
        type: choice
        options:
          - standard
          - nvidia-legacy
          - nvidia-modern
      image_tag:
        description: Published LEOS container image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: leos-iso-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  generate-iso:
    name: Generate LEOS installer (${{ inputs.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out LEOS public verification key
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Podman and BlueBuild CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          docker pull ghcr.io/blue-build/cli:v0.9-installer
          docker create --name bluebuild-cli ghcr.io/blue-build/cli:v0.9-installer
          docker cp bluebuild-cli:/out/bluebuild "$RUNNER_TEMP/bluebuild"
          docker rm bluebuild-cli
          chmod +x "$RUNNER_TEMP/bluebuild"

      - name: Select published image
        id: image
        env:
          VARIANT: ${{ inputs.variant }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag."
            exit 1
          fi
          case "$VARIANT" in
            standard) image_name="leos" ;;
            nvidia-legacy) image_name="leos-nvidia" ;;
            nvidia-modern) image_name="leos-nvidia-open" ;;
            *) echo "::error::Unknown image variant."; exit 1 ;;
          esac
          owner="${OWNER,,}"
          echo "ref=ghcr.io/$owner/$image_name:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "filename=LEOS-$VARIANT-$IMAGE_TAG.iso" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo mkdir -p /root/.docker
          printf '%s' "$GH_TOKEN" | sudo podman login --authfile /root/.docker/config.json ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify published LEOS image signature
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          test -s cosign.pub
          sudo env DOCKER_CONFIG=/root/.docker cosign verify --key cosign.pub "$IMAGE_REF"

      - name: Generate bootable installer ISO
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          ISO_NAME: ${{ steps.image.outputs.filename }}
        run: |
          set -euo pipefail
          sudo env DOCKER_CONFIG=/root/.docker REGISTRY_AUTH_FILE=/root/.docker/config.json "$RUNNER_TEMP/bluebuild" generate-iso --iso-name "$ISO_NAME" image "$IMAGE_REF"
          test -s "$ISO_NAME"
          sha256sum "$ISO_NAME" | tee "$ISO_NAME.sha256"

      - name: Upload installer ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: LEOS-installer-${{ inputs.variant }}-${{ inputs.image_tag }}
          path: |
            ${{ steps.image.outputs.filename }}
            ${{ steps.image.outputs.filename }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
