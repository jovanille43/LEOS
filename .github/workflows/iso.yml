name: Generate LEOS installer ISO

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit SHA whose signed standard image should be packaged
        required: true
        type: string
  workflow_run:
    workflows: ["Build LEOS"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

# Installer generation is serialized independently from image publication.
concurrency:
  group: leos-installer-iso
  cancel-in-progress: false

jobs:
  generate-iso:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Generate LEOS standard installer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out LEOS public verification key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Podman and Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo xorriso libarchive-tools squashfs-tools qemu-system-x86 qemu-system-gui ovmf xvfb imagemagick tesseract-ocr socat jq

      - name: Verify and install BlueBuild CLI
        env:
          CLI_IMAGE: ghcr.io/blue-build/cli:v0.9.42-installer
        run: |
          set -euo pipefail
          test -s tools/trust/blue-build-cli.pub

          # Resolve the installer tag once and verify the immutable digest
          # with the BlueBuild public key pinned in this repository.
          cli_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$CLI_IMAGE")"
          if [[ ! "$cli_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::BlueBuild registry returned an invalid installer digest."
            exit 1
          fi

          cli_repository="${CLI_IMAGE%:*}"
          cli_immutable_ref="${cli_repository}@${cli_digest}"
          echo "Verifying BlueBuild CLI installer: ${cli_immutable_ref}"
          cosign verify --key tools/trust/blue-build-cli.pub "${cli_immutable_ref}"

          docker pull "${cli_immutable_ref}"
          docker create --name bluebuild-cli "${cli_immutable_ref}"
          docker cp bluebuild-cli:/out/bluebuild "$RUNNER_TEMP/bluebuild"
          docker rm bluebuild-cli
          chmod +x "$RUNNER_TEMP/bluebuild"
          "$RUNNER_TEMP/bluebuild" --version

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo mkdir -p /root/.docker
          printf '%s' "$GH_TOKEN" | sudo podman login --authfile /root/.docker/config.json ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Select published image
        id: image
        env:
          VARIANT: standard
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_commit }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_name="leos"
          owner="${OWNER,,}"
          image_repository="ghcr.io/$owner/$image_name"

          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The source image commit SHA must be a full 40-character commit."
            exit 1
          fi
          source_prefix="${SOURCE_SHA:0:7}-"
          mapfile -t source_tags < <(
            sudo skopeo list-tags --authfile /root/.docker/config.json "docker://$image_repository" |
              jq -r --arg prefix "$source_prefix" '.Tags[]? | select(startswith($prefix))'
          )
          if [[ "${#source_tags[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one published standard image tag for source commit $SOURCE_SHA; found ${#source_tags[@]}."
            printf 'Matching tags: %s\n' "${source_tags[*]:-none}"
            exit 1
          fi
          IMAGE_TAG="${source_tags[0]}"

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid or unresolved image tag."
            exit 1
          fi
          echo "Using image built from $SOURCE_SHA: $image_repository:$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$image_repository:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "filename=LEOS-$VARIANT-$IMAGE_TAG.iso" >> "$GITHUB_OUTPUT"

      - name: Resolve and verify LEOS image tag
        id: verified
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          test -s cosign.pub

          # Verify the digest currently behind the selected tag.
          digest="$(sudo skopeo inspect --authfile /root/.docker/config.json --format '{{.Digest}}' "docker://$IMAGE_REF")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Registry returned an invalid image digest."
            exit 1
          fi

          image_repository="${IMAGE_REF%:*}"
          immutable_ref="${image_repository}@${digest}"
          echo "Verifying image digest: ${immutable_ref}"
          cosign_bin="$(command -v cosign)"
          # BlueBuild publishes LEOS key-based signatures to GHCR without a Rekor bundle.
          # Keep public-key signature and image-claim verification; skip only the absent tlog lookup.
          sudo env DOCKER_CONFIG=/root/.docker "$cosign_bin" verify --insecure-ignore-tlog --check-claims --key cosign.pub "${immutable_ref}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the packaged LEOS first-session selector
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERIFIED_DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          set -euo pipefail
          image_repository="${IMAGE_REF%:*}"
          image_digest_ref="${image_repository}@${VERIFIED_DIGEST}"
          bash tools/smoke-test-leos-session-selector.sh "${image_digest_ref}"

      - name: Generate bootable installer ISO
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERIFIED_DIGEST: ${{ steps.verified.outputs.digest }}
          ISO_NAME: ${{ steps.image.outputs.filename }}
        run: |
          set -euo pipefail
          test -n "$VERIFIED_DIGEST"

          # BlueBuild's current generate-iso command accepts tags, but drops
          # digest references. Confirm the tag still resolves to the verified
          # digest immediately before generation and after generation.
          before_digest="$(sudo skopeo inspect --authfile /root/.docker/config.json --format '{{.Digest}}' "docker://$IMAGE_REF")"
          if [[ "$before_digest" != "$VERIFIED_DIGEST" ]]; then
            echo "::error::The image tag changed after signature verification."
            exit 1
          fi

          # Fedora's KDE/Kinoite Anaconda profile hides the WebUI account page.
          # Use the Server profile so Anaconda offers account creation during install.
          # This changes the installer environment only; the deployed payload remains LEOS.
          sudo env DOCKER_CONFIG=/root/.docker REGISTRY_AUTH_FILE=/root/.docker/config.json "$RUNNER_TEMP/bluebuild" generate-iso --variant server --web-ui --iso-name "$ISO_NAME" image "$IMAGE_REF"
          test -s "$ISO_NAME"

          after_digest="$(sudo skopeo inspect --authfile /root/.docker/config.json --format '{{.Digest}}' "docker://$IMAGE_REF")"
          if [[ "$after_digest" != "$VERIFIED_DIGEST" ]]; then
            echo "::error::The image tag changed during ISO generation; refusing to publish the ISO artifact."
            rm -f "$ISO_NAME"
            exit 1
          fi

          printf '%s\n' "$VERIFIED_DIGEST" > "$ISO_NAME.source-digest"
          sha256sum "$ISO_NAME" | tee "$ISO_NAME.sha256"

      - name: Validate ISO boot structure, checksum, and source digest
        env:
          ISO_NAME: ${{ steps.image.outputs.filename }}
          VERIFIED_DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          set -euo pipefail
          bash tools/validate-installer-iso.sh "$ISO_NAME" "$VERIFIED_DIGEST"

      - name: Boot installer ISO with UEFI firmware in QEMU
        env:
          ISO_NAME: ${{ steps.image.outputs.filename }}
        run: |
          set -euo pipefail
          firmware_code=""
          firmware_vars_template=""
          for firmware_dir in /usr/share/OVMF /usr/share/ovmf; do
            for suffix in _4M ""; do
              code="$firmware_dir/OVMF_CODE${suffix}.fd"
              vars="$firmware_dir/OVMF_VARS${suffix}.fd"
              if [[ -s "$code" && -s "$vars" ]]; then
                firmware_code="$code"
                firmware_vars_template="$vars"
                break 2
              fi
            done
          done
          if [[ -z "$firmware_code" || -z "$firmware_vars_template" ]]; then
            echo "::error::Could not locate a matching OVMF CODE/VARS firmware pair."
            exit 1
          fi

          test -s "$ISO_NAME"
          firmware_vars="$RUNNER_TEMP/LEOS-OVMF-VARS.fd"
          serial_log="$RUNNER_TEMP/LEOS-installer-UEFI-serial.log"
          qemu_error_log="$RUNNER_TEMP/LEOS-installer-UEFI-qemu.stderr.log"
          monitor_socket="$RUNNER_TEMP/LEOS-installer-UEFI-monitor.sock"
          monitor_log="$RUNNER_TEMP/LEOS-installer-UEFI-monitor.log"
          screenshot_dir="$RUNNER_TEMP/LEOS-installer-UEFI-screens"
          ocr_log="$RUNNER_TEMP/LEOS-installer-UEFI-ocr.log"
          mkdir -p "$screenshot_dir"
          : > "$serial_log"
          : > "$qemu_error_log"
          : > "$monitor_log"
          : > "$ocr_log"
          cp "$firmware_vars_template" "$firmware_vars"
          export ISO_NAME firmware_code firmware_vars serial_log qemu_error_log monitor_socket monitor_log screenshot_dir ocr_log

          # Use a virtual display so the ISO boots exactly as it would on a
          # graphical machine. OCR must identify Anaconda on screen; a serial
          # console alone is not reliable unless the ISO changes its kernel
          # console mode, which could force Anaconda into text mode.
          xvfb-run -a -s "-screen 0 1280x800x24" bash -euo pipefail -c '
            qemu-system-x86_64 \
              -machine q35,accel=tcg \
              -cpu max -m 6144 -smp 4 \
              -drive if=pflash,format=raw,unit=0,readonly=on,file="$firmware_code" \
              -drive if=pflash,format=raw,unit=1,file="$firmware_vars" \
              -cdrom "$ISO_NAME" -boot order=d \
              -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
              -display sdl -serial "file:$serial_log" \
              -monitor "unix:$monitor_socket,server=on,wait=off" -no-reboot 2>"$qemu_error_log" &
            qemu_pid=$!
            cleanup() {
              kill "$qemu_pid" >/dev/null 2>&1 || true
              wait "$qemu_pid" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            # GRUB defaults to the media-integrity check entry. Select the
            # direct installer entry so this smoke test reaches Anaconda promptly.
            boot_menu_deadline=$((SECONDS + 45))
            until grep -aFq "Test this media & install" "$serial_log"; do
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                echo "::error::QEMU exited before the GRUB menu appeared."
                exit 1
              fi
              if (( SECONDS >= boot_menu_deadline )); then
                echo "::error::GRUB installer menu was not detected within 45 seconds."
                exit 1
              fi
              sleep 1
            done

            {
              printf "sendkey up\n"
              sleep 1
              printf "sendkey ret\n"
            } | timeout 10s socat -t 1 - "UNIX-CONNECT:$monitor_socket" >> "$monitor_log" 2>&1

            # The GRUB menu is rendered to the graphical console, not as a
            # stable "Booting ..." line on the serial port. The captured serial
            # trace already proves the arrow moved the highlight to "Install
            # leos 45" and Enter cleared the menu. Give the kernel/initramfs a
            # moment to start, then let the graphical OCR below be the actual
            # success criterion.
            sleep 10
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "::error::QEMU exited immediately after selecting the direct installer entry."
              exit 1
            fi

            # TCG emulation is substantially slower than native hardware; allow
            # Anaconda WebUI additional time to initialize before declaring failure.
            deadline=$((SECONDS + 900))
            frame=0
            while (( SECONDS < deadline )); do
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                break
              fi
              sleep 15
              frame=$((frame + 1))
              screenshot="$screenshot_dir/frame-$frame.png"
              import -window root "$screenshot" 2>/dev/null || continue
              [[ -s "$screenshot" ]] || continue
              frame_text="$(tesseract "$screenshot" stdout 2>/dev/null || true)"
              {
                printf "\\n--- frame %s ---\\n" "$frame"
                printf "%s\\n" "$frame_text"
              } >> "$ocr_log"
              if grep -Eiq "Welcome.*install Fedora Linux now|Installation method|Storage configuration|Review and install|Anaconda WebUI" "$ocr_log"; then
                echo "UEFI QEMU smoke test passed: Anaconda was detected on the graphical display."
                exit 0
              fi
            done

            echo "::error::Anaconda WebUI welcome screen was not detected on the graphical display within fifteen minutes."
            echo "--- OCR output ---"
            cat "$ocr_log" 2>/dev/null || true
            echo "--- QEMU stderr ---"
            cat "$qemu_error_log" 2>/dev/null || true
            echo "--- Serial output ---"
            tail -n 160 "$serial_log" 2>/dev/null || true
            exit 1
          '

      - name: Upload UEFI boot diagnostics when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LEOS-installer-uefi-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/LEOS-installer-UEFI-serial.log
            ${{ runner.temp }}/LEOS-installer-UEFI-qemu.stderr.log
            ${{ runner.temp }}/LEOS-installer-UEFI-monitor.log
            ${{ runner.temp }}/LEOS-installer-UEFI-ocr.log
            ${{ runner.temp }}/LEOS-installer-UEFI-screens/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write installer provenance manifest
        env:
          ISO_NAME: ${{ steps.image.outputs.filename }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.verified.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          VARIANT: standard
        run: |
          set -euo pipefail
          python3 tools/installer_manifest.py "$ISO_NAME" "$VARIANT" "$IMAGE_TAG" "$SOURCE_SHA" "$IMAGE_DIGEST"

      - name: Upload installer ISO and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LEOS-installer-standard-${{ steps.image.outputs.tag }}
          path: |
            ${{ steps.image.outputs.filename }}
            ${{ steps.image.outputs.filename }}.sha256
            ${{ steps.image.outputs.filename }}.source-digest
            ${{ steps.image.outputs.filename }}.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
