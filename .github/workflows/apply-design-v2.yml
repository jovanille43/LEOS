name: Apply LEOS design v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/design-leos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply supplied source files and generate transparent emblems
        shell: bash
        run: |
          set -euo pipefail
          test -s .leos-design-v2-source.tgz.b64
          python -m pip install --disable-pip-version-check Pillow numpy
          base64 --decode .leos-design-v2-source.tgz.b64 | tar -xzf - -C .
          python3 tools/derive_emblem_alpha.py
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          manifest = Path("branding/DEPLOYED_SHA256SUMS")
          content = manifest.read_text(encoding="utf-8")
          for name in ("desktop", "gaming"):
              path = Path(f"branding/{name}-logo-alpha.png")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              pattern = rf"^[0-9a-f]{{64}}  branding/{name}-logo-alpha\.png$"
              replacement = f"{digest}  branding/{name}-logo-alpha.png"
              content, count = re.subn(pattern, replacement, content, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected one manifest entry for {path}, found {count}")
          manifest.write_text(content, encoding="utf-8")
          PY
          rm .leos-design-v2-source.tgz.b64
          rm .github/workflows/apply-design-v2.yml

      - name: Run compilation and all Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q gaming launcher control_center controller_center shop leos_core desktop tests
          python -m unittest discover -s tests -v
          sha256sum --check branding/DEPLOYED_SHA256SUMS
          git diff --check

      - name: Commit the applied patch and dispatch repository CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply LEOS design v2 patch"
          git push origin "HEAD:$TARGET_BRANCH"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/recipe-checks.yml/dispatches" \
            -d "{\"ref\":\"$TARGET_BRANCH\"}"
